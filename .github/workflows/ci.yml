name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: YAML syntax
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import pathlib, yaml
          for p in list(pathlib.Path('config').rglob('*.yaml.example')) + list(pathlib.Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(p.read_text())
              print('OK', p)
          PY
      - name: Reject obvious secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env|.*\.(pem|p12|pfx|key)|id_rsa|.*\.tfstate)$'; then
            echo 'Potential secret material tracked' >&2
            exit 1
          fi
